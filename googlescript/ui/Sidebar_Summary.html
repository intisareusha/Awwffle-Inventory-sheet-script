<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; margin: 0; padding: 10px; color: #202124; background: #fff;
    }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 3px; font-weight: 500; }
    input, select { width: 100%; padding: 6px 7px; border: 1px solid #dadce0;
      border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; }
    input:focus, select:focus { outline: 2px solid #1a73e8; outline-offset: -1px; border-color: transparent; }
    .row { margin-bottom: 9px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid #e0e0e0; }
    .tab {
      padding: 7px 12px; cursor: pointer; font-size: 13px; border: none;
      background: none; color: #5f6368; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .tab:hover { background: #f8f9fa; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }

    fieldset { border: 1px solid #e0e0e0; border-radius: 6px; padding: 9px; margin: 0 0 10px; }
    legend { font-size: 11px; font-weight: 600; color: #5f6368; padding: 0 4px; }

    button { padding: 7px 13px; border-radius: 4px; border: 1px solid #dadce0;
      background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; }
    button:hover { background: #f8f9fa; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; font-weight: 500; }
    button.primary:hover { background: #1765cc; }
    button.chip { padding: 4px 9px; font-size: 11px; border-radius: 12px; }
    button.chip:hover { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    button.chip.active { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }

    /* Summary tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .tile { background: #f8f9fa; border-radius: 6px; padding: 8px 9px; }
    .tile .k { font-size: 10px; color: #5f6368; text-transform: uppercase; letter-spacing: .3px; }
    .tile .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .tile.wide { grid-column: 1 / -1; }
    .tile.money .v { color: #188038; }
    .tile.used .v { color: #a50e0e; }   /* what has been consumed — red */
    .tile.good .v { color: #188038; }   /* what remains — green */

    /* Tables */
    .tbl-wrap { max-height: 260px; overflow: auto; border: 1px solid #e0e0e0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; background: #f1f3f4; text-align: left;
         padding: 5px 6px; font-weight: 600; font-size: 11px; color: #5f6368; }
    td { padding: 5px 6px; border-top: 1px solid #f1f3f4; }
    td.n, th.n { text-align: right; }
    tr:hover td { background: #f8f9fa; }
    .neg { color: #a50e0e; font-weight: 600; }
    .up { color: #a50e0e; font-weight: 600; }
    .down { color: #137333; font-weight: 600; }

    .msg { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; display: none;
           font-size: 12px; white-space: pre-wrap; }
    .msg.error { background: #fce8e6; color: #a50e0e; border: 1px solid #f5c6c2; }
    .msg.ok { background: #e6f4ea; color: #137333; border: 1px solid #b7e1c5; }
    .muted { color: #5f6368; font-size: 11px; }
    .hidden { display: none !important; }
    .section-title { font-size: 11px; font-weight: 600; color: #5f6368;
      text-transform: uppercase; letter-spacing: .3px; margin: 12px 0 5px; }
    .section-title-row { display: flex; align-items: center; justify-content: space-between;
      margin: 12px 0 5px; }
    .section-title-row .section-title { margin: 0; }
    .cmp-toggle { display: flex; align-items: center; gap: 4px; margin: 0;
      font-size: 11px; font-weight: 500; color: #5f6368; text-transform: none;
      letter-spacing: 0; cursor: pointer; }
    .cmp-toggle input { width: auto; margin: 0; padding: 0; border: none; }

    /* Busy state: shown while a filtered summary is being computed server-side. */
    #pane-batches, #pane-bazar, #pane-stock { position: relative; }
    .busy-overlay {
      position: absolute; inset: 0; background: rgba(255,255,255,.74);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; font-size: 12px; color: #5f6368; z-index: 10; border-radius: 6px;
    }
    .spinner {
      width: 22px; height: 22px; border: 2px solid #dadce0; border-top-color: #1a73e8;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Summary</h2>

  <div id="msg" class="msg"></div>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="batches">Batches</button>
    <button type="button" class="tab" data-tab="bazar">Bazar</button>
    <button type="button" class="tab" data-tab="stock">Stock</button>
  </div>

  <!-- ================= BATCHES ================= -->
  <div id="pane-batches">
    <div class="chips" id="batchPresets"></div>
    <div class="grid2 row">
      <div><label>From</label><input type="date" id="batchFrom"></div>
      <div><label>To</label><input type="date" id="batchTo"></div>
    </div>
    <div class="row">
      <label>Preparation</label>
      <select id="batchPrep"></select>
    </div>
    <button type="button" class="primary" id="batchRun" style="width:100%">Show batches</button>
    <div id="batchOut" style="margin-top:10px"></div>
  </div>

  <!-- ================= BAZAR ================= -->
  <div id="pane-bazar" class="hidden">
    <div class="chips" id="bazarPresets"></div>
    <div class="grid2 row">
      <div><label>From</label><input type="date" id="bazarFrom"></div>
      <div><label>To</label><input type="date" id="bazarTo"></div>
    </div>
    <div class="grid2 row">
      <div><label>Expense type</label><select id="bazarType"></select></div>
      <div><label>Item</label><select id="bazarItem"></select></div>
    </div>
    <div class="grid2 row">
      <div><label>Status</label><select id="bazarStatus"></select></div>
      <div><label>Invoice</label><select id="bazarInvoice"></select></div>
    </div>
    <button type="button" class="primary" id="bazarRun" style="width:100%">Show spending</button>
    <div id="bazarOut" style="margin-top:10px"></div>
  </div>

  <!-- ================= STOCK ================= -->
  <div id="pane-stock" class="hidden">
    <div class="row">
      <label>Stock position as of</label>
      <input type="date" id="stockAsOf">
      <div class="muted">Stock is a position on a date, not a range.</div>
    </div>
    <div class="grid2 row">
      <div><label>Group</label><select id="stockGroup"></select></div>
      <div><label>Kind</label><select id="stockPopulation"></select></div>
    </div>
    <div class="row">
      <label>Item</label><select id="stockItem"></select>
    </div>
    <div class="grid2 row">
      <div>
        <label style="display:flex;gap:6px;align-items:center;font-size:12px">
          <input type="checkbox" id="stockLowOnly" style="width:auto"> Low stock only
        </label>
      </div>
      <div>
        <label style="display:flex;gap:6px;align-items:center;font-size:12px">
          <input type="checkbox" id="stockNegOnly" style="width:auto"> Negative only
        </label>
      </div>
    </div>
    <button type="button" class="primary" id="stockRun" style="width:100%">Show stock</button>
    <div id="stockOut" style="margin-top:10px"></div>
  </div>

<script>
  var OPTIONS = null;
  var currentTab = 'batches';
  var activePreset = { batch: 'all', bazar: 'all' };
  var COST_METRIC = 'avg';   // 'avg' = avg cost per batch, 'perDay' = cost / open day

  function $(id) { return document.getElementById(id); }
  function money(n) {
    if (n === '' || n === null || n === undefined) return '—';
    return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  // Money as shown in a TILE: taka sign prefix, or a dash when there is no figure.
  function moneyV(n) {
    if (n === '' || n === null || n === undefined) return '—';
    return '৳' + money(n);
  }
  function num(n) {
    if (n === '' || n === null || n === undefined) return '—';
    var v = Number(n);
    return Math.round(v * 100) / 100;
  }
  // Quantities (kg / grams / pieces) read better with separators and no forced
  // decimals: "20,300 gm", not "20300" or "20300.00".
  function qty(n) {
    if (n === '' || n === null || n === undefined) return '—';
    return Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showMsg(text, kind) {
    var el = $('msg');
    el.className = 'msg ' + (kind || 'ok');
    el.textContent = text;
    el.style.display = 'block';
  }
  function hideMsg() { $('msg').style.display = 'none'; }

  // ---- Bootstrap ----
  try {
    ['batch', 'bazar', 'stock'].forEach(function (t) {
      $(t + 'Run').addEventListener('click', function () { runTab(t); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
      btn.addEventListener('click', function () {
        currentTab = btn.getAttribute('data-tab');
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
          b.className = 'tab' + (b === btn ? ' active' : '');
        });
        ['batches', 'bazar', 'stock'].forEach(function (p) {
          $('pane-' + p).className = (p === currentTab) ? '' : 'hidden';
        });
      });
    });

    $('stockLowOnly').addEventListener('change', function () { runTab('stock'); });
    $('stockNegOnly').addEventListener('change', function () { runTab('stock'); });
    $('stockGroup').addEventListener('change', function () { populateItems(); runTab('stock'); });
    $('stockPopulation').addEventListener('change', function () { runTab('stock'); });
    $('stockItem').addEventListener('change', function () { runTab('stock'); });
    $('stockAsOf').addEventListener('change', function () { runTab('stock'); });
    $('batchPrep').addEventListener('change', function () { runTab('batch'); });
    $('batchFrom').addEventListener('change', function () { clearPreset('batch'); runTab('batch'); });
    $('batchTo').addEventListener('change', function () { clearPreset('batch'); runTab('batch'); });
    $('bazarFrom').addEventListener('change', function () { clearPreset('bazar'); runTab('bazar'); });
    $('bazarTo').addEventListener('change', function () { clearPreset('bazar'); runTab('bazar'); });
    $('bazarType').addEventListener('change', function () { populateBazarItems(); runTab('bazar'); });
    $('bazarItem').addEventListener('change', function () { runTab('bazar'); });
    $('bazarStatus').addEventListener('change', function () { runTab('bazar'); });
    $('bazarInvoice').addEventListener('change', function () { runTab('bazar'); });

    google.script.run
      .withSuccessHandler(function (opts) {
        OPTIONS = opts;
        initOptions();
      })
      .withFailureHandler(function (err) {
        showMsg('Could not load summary options: ' +
          (err && err.message ? err.message : err), 'error');
      })
      .getSummaryOptions();
  } catch (e) {
    showMsg('Summary failed to start: ' + e.message, 'error');
  }

  function initOptions() {
    // Preset chips
    var presets = OPTIONS.presets || [];
    [['batchPresets', 'batch'], ['bazarPresets', 'bazar']].forEach(function (pair) {
      var box = $(pair[0]);
      box.innerHTML = '';
      presets.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = p.label;
        b.setAttribute('data-preset', p.key);
        b.addEventListener('click', function () { applyPreset(pair[1], p.key); });
        box.appendChild(b);
      });
      setPresetActive(pair[1], 'all');
    });

    // Default range: the whole data span.
    $('batchFrom').value = OPTIONS.dataStart || OPTIONS.today;
    $('batchTo').value = OPTIONS.dataEnd || OPTIONS.today;
    $('bazarFrom').value = OPTIONS.dataStart || OPTIONS.today;
    $('bazarTo').value = OPTIONS.dataEnd || OPTIONS.today;
    $('stockAsOf').value = OPTIONS.today;

    // Preparation filter: '(all)' then each recipe in its fixed order.
    var prep = $('batchPrep');
    var allPrep = document.createElement('option');
    allPrep.value = ''; allPrep.textContent = '(all preparations)';
    prep.appendChild(allPrep);
    (OPTIONS.preparations || []).forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      prep.appendChild(o);
    });

    // Bazar filters: expense type, item (narrowed by type), invoice.
    var bt = $('bazarType');
    var allBt = document.createElement('option');
    allBt.value = ''; allBt.textContent = '(all expense types)';
    bt.appendChild(allBt);
    (OPTIONS.bazarTypes || []).forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      bt.appendChild(o);
    });

    populateBazarItems();

    var bs = $('bazarStatus');
    var allStatus = document.createElement('option');
    allStatus.value = ''; allStatus.textContent = '(paid and due)';
    bs.appendChild(allStatus);
    (OPTIONS.bazarStatuses || ['Paid', 'Due']).forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      bs.appendChild(o);
    });

    var bi = $('bazarInvoice');
    var allInv = document.createElement('option');
    allInv.value = ''; allInv.textContent = '(all invoices)';
    bi.appendChild(allInv);
    (OPTIONS.bazarInvoices || []).forEach(function (x) {
      var o = document.createElement('option');
      o.value = x.ref;
      o.textContent = x.ref + ' · ' + x.date + ' · ' + money(x.total);
      bi.appendChild(o);
    });

    // Group and population selects
    var g = $('stockGroup');
    var allG = document.createElement('option');
    allG.value = ''; allG.textContent = '(all groups)';
    g.appendChild(allG);
    (OPTIONS.groups || []).forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      g.appendChild(o);
    });

    var p = $('stockPopulation');
    var allP = document.createElement('option');
    allP.value = ''; allP.textContent = '(all kinds)';
    p.appendChild(allP);
    (OPTIONS.populations || []).forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      p.appendChild(o);
    });

    populateItems();
    runTab('batch');
  }

  function populateItems() {
    var sel = $('stockItem');
    var group = $('stockGroup').value;
    sel.innerHTML = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '(all items)';
    sel.appendChild(all);

    // Bucket by category so the expanded list reads in a predictable order:
    // Recipes, then Toppings, then Equipments. Any unexpected group falls in last.
    var buckets = {};
    (OPTIONS.items || []).forEach(function (it) {
      if (group && it.group !== group) return;
      var g = it.group || '';
      (buckets[g] || (buckets[g] = [])).push(it);
    });

    var order = ['Recipes', 'Toppings', 'Equipments'];
    Object.keys(buckets).forEach(function (g) {
      if (order.indexOf(g) === -1) order.push(g);
    });

    order.forEach(function (g) {
      var list = buckets[g];
      if (!list || !list.length) return;
      var og = document.createElement('optgroup');
      og.label = g;
      list.forEach(function (it) {
        var o = document.createElement('option');
        o.value = it.name; o.textContent = it.name;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  }

  // The Bazar item list follows the chosen expense type, so picking
  // "Inventory purchase" never offers Salary or Courier names.
  function populateBazarItems() {
    var sel = $('bazarItem');
    var type = $('bazarType').value;
    var previous = sel.value;

    sel.innerHTML = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '(all items)';
    sel.appendChild(all);

    // Bucket by expense type so the expanded list is grouped, in the same fixed
    // order as the Expense Types list. Unknown types fall in last.
    var buckets = {};
    (OPTIONS.bazarItems || []).forEach(function (it) {
      if (type && it.type !== type) return;
      var g = it.type || '';
      (buckets[g] || (buckets[g] = [])).push(it);
    });

    var order = ['Inventory purchase', 'Salary', 'Courier', 'Maintenance', 'Other'];
    Object.keys(buckets).forEach(function (g) {
      if (order.indexOf(g) === -1) order.push(g);
    });

    order.forEach(function (g) {
      var list = buckets[g];
      if (!list || !list.length) return;
      var og = document.createElement('optgroup');
      og.label = g;
      list.forEach(function (it) {
        var o = document.createElement('option');
        o.value = it.name; o.textContent = it.name;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });

    var stillThere = false;
    Array.prototype.forEach.call(sel.options, function (o) {
      if (o.value === previous) stillThere = true;
    });
    sel.value = stillThere ? previous : '';
  }

  function setPresetActive(which, key) {
    activePreset[which] = key;
    var box = $(which + 'Presets');
    if (!box) return;
    Array.prototype.forEach.call(box.children, function (b) {
      var on = b.getAttribute('data-preset') === key;
      b.className = 'chip' + (on ? ' active' : '');
    });
  }

  // Typing a date by hand means no preset describes the range any more.
  function clearPreset(which) {
    if (!activePreset[which]) return;
    setPresetActive(which, '');
  }

  // runTab/loadSummary call tabs 'batch'/'bazar'/'stock'; the panes are named
  // 'batches'/'bazar'/'stock'. This is the single place that maps the two.
  var PANE_FOR = { batch: 'pane-batches', bazar: 'pane-bazar', stock: 'pane-stock' };

  /*
   * Puts a pane into (or out of) its loading state.
   *
   * While a summary is in flight the pane is dimmed behind a spinner AND every
   * control inside it is disabled, so a second click cannot fire another request
   * and leave two answers racing for the screen. The old figures stay behind the
   * overlay rather than vanishing, so the change of number is never jarring.
   */
  function setBusy(tab, busy) {
    var pane = $(PANE_FOR[tab]);
    if (!pane) return;

    Array.prototype.forEach.call(pane.querySelectorAll('button, select, input'), function (el) {
      el.disabled = busy;
    });

    var overlay = pane.querySelector('.busy-overlay');
    if (busy) {
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'busy-overlay';
        overlay.innerHTML = '<div class="spinner"></div><div>Loading…</div>';
        pane.appendChild(overlay);
      }
    } else if (overlay) {
      overlay.parentNode.removeChild(overlay);
    }
  }

  function applyPreset(which, key) {
    setPresetActive(which, key);

    if (key === 'all') {
      $(which + 'From').value = OPTIONS.dataStart || OPTIONS.today;
      $(which + 'To').value = OPTIONS.dataEnd || OPTIONS.today;
    } else {
      // The date range has to be resolved on the server first, so hold the pane
      // busy for that round trip too; runTab then keeps it busy until the
      // filtered data is drawn.
      setBusy(which, true);
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r) { setBusy(which, false); return; }
          $(which + 'From').value = r.start;
          $(which + 'To').value = r.end;
          runTab(which);
        })
        .withFailureHandler(function (err) {
          // Silent failure here would look like the chip did nothing.
          setBusy(which, false);
          showMsg('Could not work out that date range: ' +
            (err && err.message ? err.message : err), 'error');
        })
        .resolveSummaryPreset(key, OPTIONS.today);
      return;
    }
    runTab(which);
  }

  function runTab(which) {
    hideMsg();
    if (which === 'batch') {
      loadSummary('batch', 'batchOut', function (ok, bad) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(bad)
          .summaryBatches($('batchFrom').value, $('batchTo').value, $('batchPrep').value);
      }, renderBatches, 'batches');
    } else if (which === 'bazar') {
      loadSummary('bazar', 'bazarOut', function (ok, bad) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(bad)
          .summaryBazar($('bazarFrom').value, $('bazarTo').value, {
            type: $('bazarType').value,
            item: $('bazarItem').value,
            status: $('bazarStatus').value,
            invoice: $('bazarInvoice').value
          });
      }, renderBazar, 'bazar');
    } else {
      loadSummary('stock', 'stockOut', function (ok, bad) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(bad)
          .summaryStock($('stockAsOf').value, {
            group: $('stockGroup').value,
            population: $('stockPopulation').value,
            item: $('stockItem').value,
            lowStockOnly: $('stockLowOnly').checked,
            negativeOnly: $('stockNegOnly').checked
          });
      }, renderStock, 'stock');
    }
  }

  /*
   * One request at a time per pane, and only the newest answer is drawn.
   *
   * Every filter change used to fire a server call immediately, so dragging a
   * select or tabbing through dates started several executions at once. Apps
   * Script bounds the whole project, not one request: the pile-up is what
   * produced DEADLINE_EXCEEDED, and the last-drawn pane could be an older answer
   * than the one just asked for. Coalescing rapid changes (debounce) and ignoring
   * a superseded reply fixes both, without touching what any figure means.
   */
  var PENDING = {};      // tab -> timeout id
  var REQUEST_NO = {};   // tab -> sequence of the newest request

  function loadSummary(tab, outId, call, render, errLabel) {
    // Go busy immediately, before the debounce, so even a rapid burst of filter
    // changes shows the spinner and locks the controls straight away.
    setBusy(tab, true);

    if (PENDING[tab]) clearTimeout(PENDING[tab]);
    PENDING[tab] = setTimeout(function () {
      PENDING[tab] = null;
      var seq = (REQUEST_NO[tab] || 0) + 1;
      REQUEST_NO[tab] = seq;

      // Filters are read inside `call`, i.e. now that the user has stopped
      // changing them, so the request carries the newest values.
      call(function (data) {
        // A reply for a superseded request must not overwrite a newer one. Leave
        // the pane busy: the newer request is already in flight and will clear it.
        if (REQUEST_NO[tab] !== seq) return;
        render(data);
        setBusy(tab, false);
      }, function (err) {
        if (REQUEST_NO[tab] !== seq) return;
        $(outId).innerHTML = '';
        showMsg('Could not load ' + errLabel + ': ' +
          (err && err.message ? err.message : err), 'error');
        setBusy(tab, false);
      });
    }, 250);
  }

  // ---------- Batches ----------
  function renderBatches(d) {
    var order = ['Batter', 'Nutella Mix', 'Cream', 'White Mix', 'Cheese'];
    var selected = d.preparation || '';
    var cols = selected ? [selected] : order;

    // A recipe not made in this range has no cost and no average to show, so the
    // tables drop it entirely instead of printing a column of zeros.
    var shown = cols.filter(function (p) { return d.totals[p] > 0; });
    if (!shown.length) shown = cols;

    var comparison = renderCostComparison(d.costComparison);

    if (!d.recordCount) {
      $('batchOut').innerHTML = '<div class="muted">No ' +
        (selected ? esc(selected) + ' ' : '') + 'batches recorded in this range.</div>' +
        comparison;
      bindCostToggle(d);
      return;
    }

    var totalAvgCost = 0;
    var totalCostPerOpenDay = 0;
    shown.forEach(function (p) {
      totalAvgCost += d.costPerBatch[p] || 0;
      totalCostPerOpenDay += d.costPerOpenDay[p] || 0;
    });

    var costLabel = selected ? 'Avg ' + selected + ' Cost' : 'Total Avg Cost';
    var perDayLabel = selected
      ? selected + ' Cost / Open Day' : 'Total Cost / OD';

    var tiles = '<div class="tiles">' +
      moneyTile(costLabel, totalAvgCost) +
      moneyTile(perDayLabel, d.openDays > 0 ? totalCostPerOpenDay : '') +
      tile('Calendar days', d.calendarDays) +
      tile('Open days', d.openDays) +
      tile('Closed days', d.closedDays) +
      tile('Days Record', d.recordCount) +
      '</div>';

    var warn = '';
    if (d.unpricedIngredients && d.unpricedIngredients.length) {
      warn = '<div class="muted" style="margin-bottom:9px">Cost leaves out ingredients ' +
        'with no purchase history yet: ' + esc(d.unpricedIngredients.join(', ')) + '.</div>';
    }

    var prepRows = '';
    shown.forEach(function (p) {
      prepRows += '<tr><td>' + esc(p) + '</td>' +
        '<td class="n">' + num(d.totals[p]) + '</td>' +
        '<td class="n">' + money(d.costPerBatch[p]) + '</td>' +
        '<td class="n">' + money(d.costByPreparation[p]) + '</td></tr>';
    });

    var preps = '<div class="section-title">By preparation</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Preparation</th>' +
      '<th class="n">Batches</th><th class="n">Avg cost</th><th class="n">Cost</th>' +
      '</tr></thead><tbody>' + prepRows + '</tbody></table></div>';

    var avgRows = '';
    shown.forEach(function (p) {
      avgRows += '<tr><td>' + esc(p) + '</td>' +
        '<td class="n">' + num(d.avgByPreparation[p]) + '</td>' +
        '<td class="n">' + money(d.costPerOpenDay[p]) + '</td></tr>';
    });

    var avgs = '<div class="section-title">Average per open day</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Preparation</th>' +
      '<th class="n">Avg / open day</th><th class="n">Cost / open day</th>' +
      '</tr></thead><tbody>' + avgRows + '</tbody></table></div>';

    // All time is already the Batches sheet itself, so the per-day list would just
    // repeat it. It is the maintenance view for a narrower range.
    var perDay = '';
    if (activePreset.batch !== 'all') {
      var dayRows = '';
      d.perDay.slice(0, 60).forEach(function (row) {
        var cells = '';
        shown.forEach(function (p) {
          var v = row.values[p];
          cells += '<td class="n">' + (v ? num(v) : '') + '</td>';
        });
        dayRows += '<tr><td>' + esc(row.date) + '</td><td>' + esc(row.weekday) + '</td>' +
          cells + '</tr>';
      });

      var head = '<tr><th>Date</th><th>Day</th>';
      shown.forEach(function (p) { head += '<th class="n">' + esc(p) + '</th>'; });
      head += '</tr>';

      perDay = '<div class="section-title">Per day' +
        (d.perDay.length > 60 ? ' (newest 60)' : '') + '</div>' +
        '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' +
        dayRows + '</tbody></table></div>';
    }

    $('batchOut').innerHTML = tiles + warn + preps + avgs + perDay + comparison;
    bindCostToggle(d);
  }

  function bindCostToggle(d) {
    var cb = $('cmpPerDay');
    if (!cb) return;
    cb.addEventListener('change', function () {
      COST_METRIC = cb.checked ? 'perDay' : 'avg';
      renderBatches(d);
    });
  }

  function renderCostComparison(cc) {
    if (!cc || !cc.rows || !cc.rows.length) return '';

    var perDay = COST_METRIC === 'perDay';
    var rows = '';

    cc.rows.forEach(function (r) {
      var value = perDay ? r.costPerOpenDay : r.avgCost;
      var deltaPct = perDay ? r.deltaCostPerOpenDayPct : r.deltaPct;

      var delta;
      if (deltaPct === '' || deltaPct === null || deltaPct === undefined) {
        delta = '<td class="n muted">—</td>';
      } else if (deltaPct > 0) {
        delta = '<td class="n up">▲ ' + num(Math.abs(deltaPct)) + '%</td>';
      } else if (deltaPct < 0) {
        delta = '<td class="n down">▼ ' + num(Math.abs(deltaPct)) + '%</td>';
      } else {
        delta = '<td class="n muted">0%</td>';
      }

      rows += '<tr><td>' + esc(r.label) + '</td>' +
        '<td class="n">' + num(r.batches) + '</td>' +
        '<td class="n">' + money(value) + '</td>' + delta + '</tr>';
    });

    return '<div class="section-title-row">' +
        '<span class="section-title">Cost comparison</span>' +
        '<label class="cmp-toggle"><input type="checkbox" id="cmpPerDay"' +
          (perDay ? ' checked' : '') + '> C/OD</label>' +
      '</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Date range</th>' +
      '<th class="n">Batches</th><th class="n">' + (perDay ? 'C/OD' : 'Avg cost') + '</th>' +
      '<th class="n">vs all time</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="muted">' + (perDay ? 'C/OD = cost per open day. ' : '') +
      '▲ red means higher than All time, ▼ green means lower.</div>';
  }

  // ---------- Bazar ----------
  function renderBazar(d) {
    var f = d.filters || {};
    var active = [];
    if (f.type) active.push('Type: ' + f.type);
    if (f.item) active.push('Item: ' + f.item);
    if (f.status) active.push('Status: ' + f.status);
    if (f.invoice) active.push('Invoice: ' + f.invoice);

    var filterLine = active.length
      ? '<div class="muted" style="margin-bottom:9px">Filtered — ' +
        esc(active.join(' · ')) + '</div>'
      : '';

    if (!d.count) {
      $('bazarOut').innerHTML = '<div class="muted">' +
        (active.length ? 'No purchases match these filters.'
                       : 'No purchases recorded in this range.') +
        '</div>' + filterLine;
      return;
    }

    // Total spent, then the counts that actually answer "how much did I buy".
    // Open days and avg-per-open-day are deliberately gone: spending divided by
    // days says nothing about whether a purchase was needed or expensive.
    // Paid/Due are listed only when both exist, so filtering to one status does
    // not print the other as a misleading 0.00.
    var statusTiles = '';
    var statuses = Object.keys(d.byStatus || {}).sort();
    if (statuses.length > 1) {
      statuses.forEach(function (st) {
        statusTiles += moneyTile(st, d.byStatus[st]);
      });
    }

    var tiles = '<div class="tiles">' +
      '<div class="tile money wide"><div class="k">Total spent (BDT)</div>' +
        '<div class="v">' + moneyV(d.total) + '</div></div>' +
      tile('Total items', d.itemCount) +
      tile('Invoices', d.invoices.length) +
      statusTiles +
      '</div>';

    // Rate tiles only when one item is in view: an "average rate" spanning flour
    // and napkins is a number about nothing.
    var stats = d.itemStats;
    if (stats) {
      var rateUnit = stats.rateUnit ? ' / ' + esc(stats.rateUnit) : '';

      // The latest rate carries a direction arrow against the average instead of a
      // sentence: red ▲ means you just paid more than usual, green ▼ means less.
      var arrow = '';
      if (stats.lastRate !== '' && stats.avgRate !== '' && stats.lastRate !== stats.avgRate) {
        arrow = stats.lastRate > stats.avgRate
          ? ' <span class="up">▲</span>'
          : ' <span class="down">▼</span>';
      }

      // Quantity bought: in the buying unit, plus the base-unit total when it
      // differs (Nutella -> pieces + grams, Flour -> kg + grams, Egg -> pieces only).
      var q = stats.quantity;
      var qtyTiles = '';
      if (q && q.value !== '' && q.value !== null) {
        qtyTiles += tile('Purchased quantity', qty(q.value) + ' ' + q.unit);
        if (q.showBase) {
          qtyTiles += tile('Total ' + q.baseUnit, qty(q.baseValue) + ' ' + q.baseUnit);
        }
      }

      tiles += '<div class="tiles">' +
        moneyTile('Avg rate' + rateUnit, stats.avgRate) +
        '<div class="tile money"><div class="k">Last rate' + rateUnit + '</div>' +
          '<div class="v">' + moneyV(stats.lastRate) + arrow + '</div></div>' +
        qtyTiles +
        '</div>';
    }

    var typeRows = '';
    Object.keys(d.byType).sort().forEach(function (t) {
      typeRows += '<tr><td>' + esc(t) + '</td><td class="n">' +
        money(d.byType[t]) + '</td></tr>';
    });
    var byType = '<div class="section-title">By expense</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Type</th>' +
      '<th class="n">Amount</th></tr></thead><tbody>' + typeRows + '</tbody></table></div>';

    // "All items selected" means the Total Purchase table is the whole story, so
    // this per-purchase detail is skipped then. With any filter on, the same table
    // becomes a summary and these rows are what answer "which bazar, at what rate".
    var narrowed = f.item || f.type || f.status || f.invoice;
    var purchased = '';
    if (narrowed) {
      var pRows = '';
      d.purchases.slice(0, 60).forEach(function (x) {
        pRows += '<tr><td>' + esc(x.date) + '</td>' +
          '<td>' + esc(x.ref || '—') + '</td>' +
          '<td class="n">' + (x.quantity === null ? '—' : num(x.quantity)) + '</td>' +
          '<td>' + esc(x.unit) + '</td>' +
          '<td class="n">' + money(x.rate) + '</td>' +
          '<td class="n">' + money(x.amount) + '</td>' +
          '<td>' + esc(x.status) + '</td></tr>';
      });
      purchased = '<div class="section-title">By items purchased' +
        (d.purchases.length > 60 ? ' (newest 60)' : '') + '</div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Ref</th>' +
        '<th class="n">Qty</th><th>Unit</th><th class="n">Rate</th>' +
        '<th class="n">Amount</th><th>Status</th></tr></thead><tbody>' +
        pRows + '</tbody></table></div>';
    }

    var itemRows = '';
    d.items.forEach(function (x) {
      itemRows += '<tr><td>' + esc(x.item) + '</td><td>' + esc(x.quantityText) +
        '</td><td class="n">' + money(x.amount) + '</td></tr>';
    });
    var byItem = '<div class="section-title">Total purchase</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Quantity</th>' +
      '<th class="n">Amount</th></tr></thead><tbody>' + itemRows + '</tbody></table></div>';

    var invRows = '';
    d.invoices.slice(0, 40).forEach(function (x) {
      invRows += '<tr><td>' + esc(x.ref) + '</td><td>' + esc(x.date) + '</td>' +
        '<td class="n">' + x.lines + '</td><td class="n">' + money(x.total) + '</td></tr>';
    });
    var byInvoice = '<div class="section-title">By invoice</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Date</th>' +
      '<th class="n">Lines</th><th class="n">Amount</th></tr></thead><tbody>' +
      invRows + '</tbody></table></div>';

    $('bazarOut').innerHTML = tiles + filterLine + purchased + byItem + byType + byInvoice;
  }

  // ---------- Stock ----------
  function renderStock(d) {
    if (!d.rowCount) {
      $('stockOut').innerHTML = '<div class="muted">No items match these filters.</div>';
      return;
    }

    // A single item in view gets quantity tiles in its own units; across many
    // items grams and pieces cannot be summed, so those tiles are omitted.
    var single = d.rowCount === 1 ? d.rows[0] : null;

    var tiles = '<div class="tiles">' +
      '<div class="tile money wide"><div class="k">Total cost (used + remaining)</div>' +
        '<div class="v">' + moneyV(d.totals.totalCost) + '</div></div>';

    if (single) {
      // Used = red, remaining = green, at a glance.
      tiles += tintedTile('Total used (' + single.baseUnit + ')', qty(single.totalUsed), 'used') +
        tintedTile('Remaining stock (' + single.baseUnit + ')', qty(single.remainingQty), 'good');
      // Piece-items held in grams (Nutella, Whipped Cream): also show the count.
      if (single.pieceBase) {
        tiles += tintedTile('Total used (' + single.displayUnit + ')', qty(single.usedDisplay), 'used') +
          tintedTile('Remaining stock (' + single.displayUnit + ')', qty(single.remainingDisplay), 'good');
      }
    }

    tiles += tintedTile('Used cost', moneyV(d.totals.usedCost), 'used') +
      moneyTile('Remaining value', d.totals.remainingValue);

    // How long the remaining stock lasts — a per-item figure, so only shown
    // when a single item is in view (sits above the Low stock count).
    if (single) {
      tiles += tile('Est batches',
          (single.estBatches === '' || single.estBatches === null) ? '—' : single.estBatches) +
        tile('Est open days',
          (single.estDays === '' || single.estDays === null) ? '—' : single.estDays);
    }

    tiles += tile('Low stock', d.lowCount) +
      '</div>';

    // One searched item that is low gets its own red callout, replacing the old
    // "Remaining: 2975 gm" line.
    if (single && single.lowStock) {
      var why = single.negative
        ? ' has negative stock — almost always a missing purchase'
        : ' is low on stock';
      tiles += '<div class="msg error" style="display:block">' +
        esc(single.item) + why + '.</div>';
    } else if (d.negativeCount) {
      tiles += '<div class="msg error" style="display:block">' +
        d.negativeCount + ' item(s) have negative stock — almost always a missing purchase.</div>';
    }

    // Remaining-stock table only: item, remaining qty, avg rate, remaining value,
    // and a red/green low-stock sign. No estimated days and no flags column.
    var rows = '';
    d.rows.forEach(function (r) {
      var neg = r.remainingQty < 0;
      var sign = r.lowStock
        ? '<span class="up" title="Low stock">●</span>'
        : '<span class="down" title="Adequate">●</span>';
      rows += '<tr>' +
        '<td' + (neg ? ' class="neg"' : '') + '>' + esc(r.item) + '</td>' +
        '<td class="n">' + qty(r.remainingQty) + '</td>' +
        '<td class="n">' + num(r.avgRate) + '</td>' +
        '<td class="n">' + money(r.remainingValue) + '</td>' +
        '<td class="n">' + ((r.estBatches === '' || r.estBatches === null) ? '—' : r.estBatches) + '</td>' +
        '<td class="n">' + sign + '</td>' +
        '</tr>';
    });

    var table = '<div class="section-title">Remaining Stock Value (' + esc(d.asOf) + ')</div>' +
      '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>Item</th><th class="n">Qty</th><th class="n">Avg rate</th>' +
      '<th class="n">Value</th><th class="n">Est batches</th><th class="n">Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

    $('stockOut').innerHTML = tiles + table;
  }

  function tile(k, v) {
    return '<div class="tile"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + esc(v) + '</div></div>';
  }

  // A money tile: same shape as tile(), but the value carries the taka sign and
  // the green money colour. Use only for currency figures — not counts or days.
  function moneyTile(k, n) {
    return '<div class="tile money"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + esc(moneyV(n)) + '</div></div>';
  }

  // A tile with an explicit colour class: 'used' (red) or 'good' (green).
  function tintedTile(k, v, cls) {
    return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + esc(v) + '</div></div>';
  }
</script>
</body>
</html>
