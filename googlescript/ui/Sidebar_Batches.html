<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; margin: 0; padding: 10px; color: #202124; background: #fff;
    }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 3px; font-weight: 500; }
    input, select, textarea {
      width: 100%; padding: 6px 7px; border: 1px solid #dadce0; border-radius: 4px;
      font-size: 13px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #1a73e8; outline-offset: -1px; border-color: transparent;
    }
    .row { margin-bottom: 9px; }

    /* Batch entry row: name on the left, number box on the right. */
    .prep-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid #f1f3f4;
    }
    .prep-row:last-child { border-bottom: none; }
    .prep-name { font-size: 13px; flex: 1; }
    .prep-row input { width: 92px; text-align: right; font-size: 14px; padding: 6px 8px; }
    button {
      padding: 7px 13px; border-radius: 4px; border: 1px solid #dadce0;
      background: #fff; cursor: pointer; font-size: 13px; font-family: inherit;
    }
    button:hover { background: #f8f9fa; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; font-weight: 500; }
    button.primary:hover { background: #1765cc; }
    button.danger { color: #c5221f; border-color: #f5c6c2; }
    button.danger:hover { background: #fce8e6; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .actions .spacer { flex: 1; }
    #total { font-size: 15px; font-weight: 600; }
    .msg { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; display: none;
           font-size: 12px; white-space: pre-wrap; }
    .msg.error { background: #fce8e6; color: #a50e0e; border: 1px solid #f5c6c2; }
    .msg.ok { background: #e6f4ea; color: #137333; border: 1px solid #b7e1c5; }
    .msg.warn { background: #fef7e0; color: #b06000; border: 1px solid #feefc3; }
    fieldset { border: 1px solid #e0e0e0; border-radius: 6px; padding: 9px; margin: 0 0 10px; }
    legend { font-size: 11px; font-weight: 600; color: #5f6368; padding: 0 4px; }
    .mode { font-size: 11px; padding: 3px 8px; border-radius: 10px; margin-left: 6px; }
    .mode.edit { background: #fef7e0; color: #b06000; }

    /* Shown when the chosen date already has a saved batch. */
    #editing {
      display: none; align-items: center; gap: 8px;
      background: #fef7e0; border: 1px solid #feefc3; color: #b06000;
      padding: 7px 9px; border-radius: 4px; margin-bottom: 10px; font-size: 12px;
    }
    #editing .txt { flex: 1; }
    #recent { max-height: 210px; overflow-y: auto; }
    .recent-item {
      display: flex; justify-content: space-between; padding: 5px 6px;
      border-bottom: 1px solid #f1f3f4; cursor: pointer; font-size: 12px;
    }
    .recent-item:hover { background: #f8f9fa; }
    .recent-item .d { font-weight: 500; }
    .recent-item .t { color: #5f6368; }
    .closed-flag { color: #b06000; font-size: 11px; }
    .muted { color: #5f6368; font-size: 11px; }
  </style>
</head>
<body>
  <h2>Daily batches</h2>

  <div id="msg" class="msg"></div>

  <div id="editing">
    <span class="txt" id="editingText"></span>
    <button type="button" id="delete" class="danger">Delete</button>
  </div>

  <div class="row">
    <label for="date">Production date</label>
    <input type="date" id="date">
    <div id="closedNote" class="closed-flag"></div>
  </div>

  <!--
    The five preparation inputs are written directly in HTML, not generated by
    script. They exist even if scripting fails, so the form can never render
    without its entry fields.
  -->
  <fieldset>
    <legend>Batches made <span class="muted">(blank or 0 = none; fractions allowed)</span></legend>

    <div class="prep-row">
      <span class="prep-name">Batter</span>
      <input type="number" id="q_Batter" class="qty" step="any" min="0" placeholder="0">
    </div>
    <div class="prep-row">
      <span class="prep-name">Nutella Mix</span>
      <input type="number" id="q_NutellaMix" class="qty" step="any" min="0" placeholder="0">
    </div>
    <div class="prep-row">
      <span class="prep-name">Cream</span>
      <input type="number" id="q_Cream" class="qty" step="any" min="0" placeholder="0">
    </div>
    <div class="prep-row">
      <span class="prep-name">White Mix</span>
      <input type="number" id="q_WhiteMix" class="qty" step="any" min="0" placeholder="0">
    </div>
    <div class="prep-row">
      <span class="prep-name">Cheese</span>
      <input type="number" id="q_Cheese" class="qty" step="any" min="0" placeholder="0">
    </div>
  </fieldset>

  <div class="row">
    <label for="notes">Notes (optional)</label>
    <input type="text" id="notes" placeholder="e.g. extra batter for a big order">
  </div>

  <div class="actions">
    <span>Total: <span id="total">0</span> batches</span>
    <span class="spacer"></span>
    <button type="button" id="save" class="primary">Save batch</button>
  </div>

  <fieldset style="margin-top:12px">
    <legend>Recent batches <span class="muted">(click one to edit)</span></legend>
    <div id="recent"></div>
  </fieldset>

<script>
  // Inputs are looked up by id via getElementById, which works in every Apps
  // Script HTML sandbox mode. The earlier version created them dynamically and
  // used querySelectorAll, which is unavailable in the legacy sandbox and failed
  // silently — leaving the form with no batch fields at all.
  var FIELDS = [
    { prep: 'Batter',      id: 'q_Batter' },
    { prep: 'Nutella Mix', id: 'q_NutellaMix' },
    { prep: 'Cream',       id: 'q_Cream' },
    { prep: 'White Mix',   id: 'q_WhiteMix' },
    { prep: 'Cheese',      id: 'q_Cheese' }
  ];

  function $(id) { return document.getElementById(id); }

  function recalc() {
    var total = 0;
    for (var i = 0; i < FIELDS.length; i++) {
      var el = $(FIELDS[i].id);
      if (!el) continue;
      var v = parseFloat(el.value);
      if (!isNaN(v) && v > 0) total += v;
    }
    $('total').textContent = Math.round(total * 1000) / 1000;
    return total;
  }

  function showMsg(text, kind) {
    var el = $('msg');
    el.className = 'msg ' + (kind || 'ok');
    el.textContent = text;
    el.style.display = 'block';
  }

  function hideMsg() { $('msg').style.display = 'none'; }

  function setEditing(isEditing, dateKey) {
    if (isEditing) {
      $('editingText').textContent = 'Editing the saved batch for ' + dateKey + '. Saving updates it.';
      $('editing').style.display = 'flex';
    } else {
      $('editing').style.display = 'none';
    }
  }

  function setClosedNote(isClosed) {
    $('closedNote').textContent = isClosed
      ? 'This date is recorded as a closed day. Saving is still allowed.'
      : '';
  }

  function clearInputs() {
    for (var i = 0; i < FIELDS.length; i++) {
      var el = $(FIELDS[i].id);
      if (el) el.value = '';
    }
    $('notes').value = '';
    recalc();
  }

  /** Loads the batch for the chosen date, or clears the form when none exists. */
  function loadDate() {
    var date = $('date').value;
    if (!date) return;

    google.script.run
      .withSuccessHandler(function (existing) {
        if (!existing) {
          setEditing(false);
          setClosedNote(false);
          clearInputs();
          return;
        }

        setEditing(true, existing.date);
        setClosedNote(existing.isClosed);

        for (var i = 0; i < FIELDS.length; i++) {
          var el = $(FIELDS[i].id);
          if (!el) continue;
          var v = existing.values[FIELDS[i].prep];
          el.value = (v === '' || v === null || v === undefined) ? '' : v;
        }
        recalc();
      })
      .withFailureHandler(function (err) {
        showMsg('Could not load that date: ' + (err && err.message ? err.message : err), 'error');
      })
      .getBatchForDate(date);
  }

  function collect() {
    var values = {};
    for (var i = 0; i < FIELDS.length; i++) {
      var el = $(FIELDS[i].id);
      values[FIELDS[i].prep] = el ? el.value : '';
    }
    return {
      date: $('date').value,
      values: values,
      notes: $('notes').value
    };
  }

  function save() {
    hideMsg();
    var btn = $('save');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.ok) { showMsg(res.errors.join('\n'), 'error'); return; }

        var kind = 'ok';
        var text = res.message;
        if (res.warnings && res.warnings.length) {
          text += '\n' + res.warnings.join('\n');
          kind = 'warn';
        }
        showMsg(text, kind);
        loadDate();
        refreshRecent();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        showMsg('Error: ' + (err && err.message ? err.message : err), 'error');
      })
      .saveBatch(collect());
  }

  function remove() {
    var date = $('date').value;
    if (!date) return;
    if (!confirm('Delete the batch for ' + date + '?\n\nThat day\'s ingredient usage will be removed.')) return;

    $('delete').disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        $('delete').disabled = false;
        if (!res.ok) { showMsg(res.errors.join('\n'), 'error'); return; }
        showMsg(res.message, 'ok');
        loadDate();
        refreshRecent();
      })
      .withFailureHandler(function (err) {
        $('delete').disabled = false;
        showMsg('Error: ' + (err && err.message ? err.message : err), 'error');
      })
      .deleteBatch(date);
  }

  function renderList(rows) {
    var el = $('recent');
    el.innerHTML = '';

    if (!rows || !rows.length) {
      el.innerHTML = '<div class="muted">No batches recorded yet.</div>';
      return;
    }

    for (var i = 0; i < rows.length; i++) {
      (function (r) {
        var parts = [];
        for (var j = 0; j < FIELDS.length; j++) {
          var v = r.values ? r.values[FIELDS[j].prep] : '';
          if (v !== '' && v !== null && v !== undefined && Number(v) !== 0) {
            parts.push(FIELDS[j].prep + ' ' + v);
          }
        }

        var row = document.createElement('div');
        row.className = 'recent-item';

        var left = document.createElement('span');
        left.className = 'd';
        left.textContent = r.key;

        var right = document.createElement('span');
        right.className = 't';
        right.textContent = parts.join(', ') || '—';

        row.appendChild(left);
        row.appendChild(right);
        row.addEventListener('click', function () {
          $('date').value = r.key;
          loadDate();
        });
        el.appendChild(row);
      })(rows[i]);
    }
  }

  function refreshRecent() {
    google.script.run
      .withSuccessHandler(renderList)
      .withFailureHandler(function () {})
      .getRecentBatches(30);
  }

  // ---- Bootstrap ----
  // Wrapped so a failure reports itself rather than leaving a half-built form.
  try {
    // Local date, not UTC: toISOString() would give the wrong day in any
    // timezone behind UTC. The server sets the authoritative "today" below.
    (function setLocalToday() {
      var now = new Date();
      var m = now.getMonth() + 1;
      var d = now.getDate();
      $('date').value = now.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
    })();

    for (var i = 0; i < FIELDS.length; i++) {
      var el = $(FIELDS[i].id);
      if (el) el.addEventListener('input', recalc);
    }
    $('date').addEventListener('change', loadDate);
    $('save').addEventListener('click', save);
    $('delete').addEventListener('click', remove);

    recalc();

    // Ask the server for today's date, the recipe's health, and recent batches.
    // The entry fields work even if this call fails.
    google.script.run
      .withSuccessHandler(function (opts) {
        if (opts && opts.today) $('date').value = opts.today;

        if (opts && opts.measurementErrors && opts.measurementErrors.length) {
          showMsg('The recipe (Measurements) has problems, so stock calculations would be wrong:\n' +
            opts.measurementErrors.join('\n'), 'error');
        } else if (opts && opts.measurementWarnings && opts.measurementWarnings.length) {
          showMsg('Recipe note:\n' + opts.measurementWarnings.join('\n'), 'warn');
        }

        renderList(opts && opts.recent ? opts.recent : []);
        loadDate();
      })
      .withFailureHandler(function (err) {
        showMsg('Could not reach the server: ' +
          (err && err.message ? err.message : err), 'error');
        loadDate();
      })
      .getBatchFormOptions();
  } catch (e) {
    showMsg('The form failed to start: ' + e.message, 'error');
  }
</script>
</body>
</html>
