<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; margin: 0; padding: 10px; color: #202124; background: #fff;
    }
    h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
    label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 3px; font-weight: 500; }
    input, select {
      width: 100%; padding: 6px 7px; border: 1px solid #dadce0; border-radius: 4px;
      font-size: 13px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus {
      outline: 2px solid #1a73e8; outline-offset: -1px; border-color: transparent;
    }
    .row { margin-bottom: 9px; }
    .two { display: flex; gap: 6px; }
    .two > div { flex: 1; }
    button { padding: 7px 13px; border-radius: 4px; border: 1px solid #dadce0;
      background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; }
    button:hover { background: #f8f9fa; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; font-weight: 500; }
    button.primary:hover { background: #1765cc; }
    button:disabled { opacity: .5; cursor: default; }

    fieldset { border: 1px solid #e0e0e0; border-radius: 6px; padding: 9px; margin: 0 0 10px; }
    legend { font-size: 11px; font-weight: 600; color: #5f6368; padding: 0 4px; }

    .msg { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; display: none;
           font-size: 12px; white-space: pre-wrap; }
    .msg.error { background: #fce8e6; color: #a50e0e; border: 1px solid #f5c6c2; }
    .msg.ok { background: #e6f4ea; color: #137333; border: 1px solid #b7e1c5; }
    .msg.warn { background: #fef7e0; color: #b06000; border: 1px solid #feefc3; }

    .muted { color: #5f6368; font-size: 11px; }
  </style>
</head>
<body>
  <h2>Record a discount</h2>

  <div id="msg" class="msg"></div>

  <fieldset>
    <legend>Today's discount</legend>
    <div class="two">
      <div class="row">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
      <div class="row">
        <label for="amount">Amount (BDT)</label>
        <input type="number" id="amount" min="0" step="any" placeholder="0">
      </div>
    </div>
    <div class="row">
      <label for="notes">Note (optional)</label>
      <input type="text" id="notes" placeholder="e.g. staff meal, regular customer">
    </div>
    <button type="button" id="save" class="primary" style="width:100%">Save discount</button>
  </fieldset>

  <div class="muted" style="margin-top:10px">
    One discount per day. Saving the same date corrects that day instead of adding a
    second one, so a day can never be discounted twice.
  </div>

<script>
  var PANEL = null;

  function $(id) { return document.getElementById(id); }

  function showMsg(text, kind) {
    var el = $('msg');
    el.className = 'msg ' + (kind || 'ok');
    el.textContent = text;
    el.style.display = 'block';
  }
  function hideMsg() { $('msg').style.display = 'none'; }

  function save() {
    hideMsg();
    var payload = {
      date: $('date').value,
      amount: $('amount').value,
      notes: $('notes').value
    };

    var btn = $('save');
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.ok) { showMsg((res.errors || ['Could not save.']).join('\n'), 'error'); return; }
        PANEL = res.panel;
        showMsg(res.message, 'ok');
        $('amount').value = '';
        $('notes').value = '';
        $('date').value = PANEL.today;
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        showMsg('Error: ' + (err && err.message ? err.message : err), 'error');
      })
      .saveDiscount(payload);
  }

  // ---- Bootstrap ----
  try {
    $('save').addEventListener('click', save);

    google.script.run
      .withSuccessHandler(function (panel) {
        PANEL = panel;
        $('date').value = panel.today;
      })
      .withFailureHandler(function (err) {
        showMsg('Could not load the form: ' + (err && err.message ? err.message : err), 'error');
      })
      .getDiscountPanel();
  } catch (e) {
    showMsg('The form failed to start: ' + e.message, 'error');
  }
</script>
</body>
</html>
